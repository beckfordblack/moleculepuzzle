<!DOCTYPE html>
<html lang="jp">
<head>
    <title>MOLECULE PUZZLE</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://beckfordblack.github.io/moleculepuzzle/"/>
    <meta property="og:title" content="MOLECULE PUZZLE"/>
    <meta property="og:description" content="課題研究Ⅱ"/>
    <meta property="og:image" content="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/og_image.png"/>

    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div id="game">
        <div id="title"></div>
        <div id="score">0</div>
        <div id="board"></div>
        <div id="menu">
            <button id="homeButton" class="menuButton"></button>
            <button id="skipButton" class="menuButton"></button>
        </div>

        <div id="startScreen" class="screen">
            <h1>
                <span>MOLECULE</span>
                <span>PUZZLE</span>
            </h1>
            <button id="startButton">START</button>
        </div>

        <div id="gameOverScreen" class="screen hidden">
            <h1>GAME OVER</h1>
            <p id="finalScore"></p>
            <button id="retryButton">RETRY</button>
        </div>
    </div>
    <script src="index.js"></script>
</body/
</html>
