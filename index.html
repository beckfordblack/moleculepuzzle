<!DOCTYPE html>
<html lang="jp">
<head>
    <title>MOLECULE PUZZLE</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://beckfordblack.github.io/moleculepuzzle/"/>
    <meta property="og:title" content="MOLECULE PUZZLE"/>
    <meta property="og:description" content="課題研究Ⅱ"/>
    <meta property="og:image" content="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/og_image.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Google+Sans+Flex:opsz,wght@6..144,200&family=Shippori+Antique+B1&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div id="game">
        <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_glow.png" style="width: 100%; z-index: 0;">
        <div id="title" class="title"></div>
        <div id="score" class="title">0</div>
        <div id="board"></div>
        <button id="homeButton" class="menuButton title" style="left: 180px;">HOME</button>
        <button id="skipButton" class="menuButton title" style="right: 180px;">→</button>
        <div id="startScreen" class="screen">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" class="ball" style="width: 500px; top: -250px; left: -150px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_green.png" class="ball" style="width: 120px; bottom: 80px; right: 200px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" class="ball" style="width: 250px; bottom: -80px; right: 80px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" class="ball" style="width: 300px; bottom: -200px; left: 250px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_green.png" class="ball" style="width: 180px; bottom: 120px; left: 40px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_red.png" class="ball" style="width: 150px; top: 30px; right: 50px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_glow.png" style="width: 100%; z-index: 3;">
            <h1 class="title" style="top: 440px;">MOLECULE</h1>
            <h1 class="title" style="top: 570px; background: linear-gradient(to right, #8beefe, #92eeb9); background-clip: text; color: transparent;">PUZZLE</h1>
            <div class="title" style="width: 400px; height: 3px; top: 830px; background: white;"></div>
            <div class="title" style="display: flex; align-items: center;">
                <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/icon_trophy.png" style="width: 100px;">
                <span id="highScore" style="font-size: 80px; font-weight: 100;">0</span>
            </div>
            <button id="startButton" class="title" style="top: 1150px;">START</button>
            <div class="title" style="width: 100px; height: 3px; top: 1210px; left: 170px; background: white;"></div>
            <div class="title" style="width: 100px; height: 3px; top: 1210px; right: 170px; background: white;"></div>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h1 class="title" style="top: 500px;">GAME OVER</h1>
            <p id="finalScore" class="title"></p>
            <button id="retryButton" class="title" style="top: 1200px;">RETRY</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
