<!DOCTYPE html>
<html lang="jp">
<head>
    <title>MOLECULE PUZZLE</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://beckfordblack.github.io/moleculepuzzle/"/>
    <meta property="og:title" content="MOLECULE PUZZLE"/>
    <meta property="og:description" content="課題研究Ⅱ"/>
    <meta property="og:image" content="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/og_image.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&family=Google+Sans+Flex:opsz,wght@6..144,200&family=Shippori+Antique+B1&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div id="game">.
        <canvas id="background"></canvas>
        <div id="startScreen" class="screen">
            <h1 class="title" style="top: 440px;">MOLECULE</h1>
            <h1 class="title" style="top: 590px;">PUZZLE</h1>
            <div class="title" style="display: flex; align-items: center; top: 950px;">
                <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/icon_trophy.png" style="width: 100px;">
                <span id="highScore" style="font-size: 80px; font-weight: 100;">0</span>
            </div>
            <button id="startButton" class="title" style="top: 1150px;">START</button>
            <div class="title" style="width: 100px; height: 3px; top: 1210px; left: 170px; background: white;"></div>
            <div class="title" style="width: 100px; height: 3px; top: 1210px; right: 170px; background: white;"></div>
        </div>
        <div id="gameScreen" class="screen hidden">
            <h2 id="title" class="title"></h2>
            <h2 id="score" class="title">0</h2>
            <div id="board"></div>
            <button id="homeButton" class="menuButton title" style="left: 180px;">HOME</button>
            <button id="skipButton" class="menuButton title" style="right: 180px;">→</button>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h2 id="gameOverTitle">GAME OVER</h1>
                <div id="rankingArea">
                    <p id="rankingTitle">RANKING</p>
                    <ol id="rankingList"></ol>
                </div>
            <p id="finalScore">0</p>
            <div id="rankingSubmit">
                <input id="playerName" type="text" maxlength="20" placeholder="プレイヤー名">
                <button id="submitScoreButton">スコアを登録</button>
                <p id="submitStatus"style="top: 1500px; font-size: 30px;"></p>
            </div>
            <button id="retryButton">RETRY</button>
        </div>
        <div id="loadingScreen" class="screen"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
