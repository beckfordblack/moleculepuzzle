<!DOCTYPE html>
<html lang="jp">
<head>
    <title>MOLECULE PUZZLE</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <meta property="og:type" content="website"/>
    <meta property="og:url" content="https://beckfordblack.github.io/moleculepuzzle/"/>
    <meta property="og:title" content="MOLECULE PUZZLE"/>
    <meta property="og:description" content="課題研究Ⅱ"/>
    <meta property="og:image" content="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/og_image.png"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Isometra&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,200&display=swap" rel="stylesheet">
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Antique+B1&display=swap" rel="stylesheet">
  
    <link rel="stylesheet" href="index.css"/>
</head>
<body>
    <div id="game">
        <div id="title"></div>
        <div id="score">0</div>
        <div id="board"></div>
        <div id="menu">
            <button id="homeButton" class="menuButton"></button>
            <button id="skipButton" class="menuButton"></button>
        </div>
        <div id="startScreen" class="screen">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" style="width: 500px; top: -250px; left: -150px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_green.png" style="width: 120px; bottom: 80px; right: 200px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" style="width: 250px; bottom: -80px; right: 80px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_blue.png" style="width: 300px; bottom: -200px; left: 250px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_green.png" style="width: 180px; bottom: 120px; left: 40px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_red.png" style="width: 150px; top: 30px; right: 50px;">
            <img src="https://github.com/beckfordblack/moleculepuzzle/raw/main/images/title_glow.png" style="width: 100%;">
            <h1 style="top: 440px;">MOLECULE</h1>
            <h1 style="top: 580px;background: linear-gradient(to right, #8beefe, #92eeb9); background-clip: text; color: transparent;">PUZZLE</h1>
            <button id="startButton" style="top: 1100px;">START</button>
            <p style="top: 1050px; letter-spacing: -6px;">-----　　　　　　　　　　-----</p>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h1 style="top: 500px;">GAME OVER</h1>
            <p id="finalScore"></p>
            <button id="retryButton" style="top: 1200px;">RETRY</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
