<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Firestoreテスト</title>
</head>
<body>
  <button id="testButton">テストデータを登録</button>
  <p id="result"></p>

  <script type="module">
    import { saveScore } from "./firestore.js";

    document.getElementById("testButton").addEventListener("click", async () => {
      const result = document.getElementById("result");
      result.textContent = "登録中...";

      try {
        await saveScore("テスト", 100);
        result.textContent = "登録成功";
      } catch (error) {
        console.error(error);
        result.textContent = "登録失敗: " + error.message;
      }
    });
  </script>
</body>
</html>
