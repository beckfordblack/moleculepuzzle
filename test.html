
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Firestoreランキングテスト</title>
</head>
<body>
  <h1>ランキング</h1>
  <button id="loadButton">ランキングを取得</button>
  <ol id="ranking"></ol>
  <p id="result"></p>

  <script type="module">
    import { getRanking } from "./firestore.js";

    const ranking = document.getElementById("ranking");
    const result = document.getElementById("result");

    document.getElementById("loadButton").addEventListener("click", async () => {
      result.textContent = "取得中...";
      ranking.replaceChildren();

      try {
        const scores = await getRanking();

        scores.forEach((data) => {
          const item = document.createElement("li");
          item.textContent = `${data.name}: ${data.score}点`;
          ranking.appendChild(item);
        });

        result.textContent = scores.length
          ? ""
          : "まだ記録がありません";
      } catch (error) {
        console.error(error);
        result.textContent = "取得失敗: " + error.message;
      }
    });
  </script>
</body>
</html>
